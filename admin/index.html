<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 自动发卡商城</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-container { max-width: 900px; }
        .login-box {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            margin: 60px auto;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            text-align: center;
        }
        .login-box h2 { margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #666; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #667eea;
        }
        .form-group textarea { min-height: 120px; resize: vertical; font-family: monospace; }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            border-bottom: 2px solid #eee;
        }
        .tab {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
            color: #666;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .admin-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .admin-card h3 { margin-bottom: 16px; font-size: 18px; }
        .product-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .product-row:last-child { border-bottom: none; }
        .product-info { flex: 1; }
        .product-info .name { font-weight: 600; font-size: 15px; }
        .product-info .meta { font-size: 13px; color: #999; margin-top: 4px; }
        .product-price { font-size: 18px; font-weight: 700; color: #e74c3c; }
        .order-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .order-table th, .order-table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        .order-table th { background: #f9f9f9; font-weight: 600; color: #666; }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending { background: #fff7e6; color: #fa8c16; }
        .status-paid { background: #f6ffed; color: #52c41a; }
        .status-failed { background: #fff1f0; color: #f5222d; }
        .logout-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            padding: 8px 12px;
        }
        .logout-btn:hover { color: #e74c3c; }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .hint { font-size: 13px; color: #999; margin-top: 8px; }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .stat-value { font-size: 28px; font-weight: 700; color: #667eea; }
        .stat-label { font-size: 13px; color: #999; margin-top: 4px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">管理后台</h1>
            <p class="subtitle">自动发卡商城 · 管理控制台</p>
        </div>
    </header>

    <main class="container admin-container">
        <!-- 登录页 -->
        <div id="login-page">
            <div class="login-box">
                <h2>管理员登录</h2>
                <div class="form-group">
                    <label>管理密码</label>
                    <input type="password" id="login-password" placeholder="请输入管理密码">
                </div>
                <button class="btn btn-primary" onclick="doLogin()" style="width:100%;">登录</button>
                <p class="hint">密码在 Vercel 环境变量 ADMIN_PASSWORD 中设置</p>
            </div>
        </div>

        <!-- 管理面板 -->
        <div id="admin-page" style="display:none;">
            <div class="admin-header">
                <h2 style="font-size:20px;">控制台</h2>
                <button class="logout-btn" onclick="doLogout()">退出登录</button>
            </div>

            <!-- 统计 -->
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-total-orders">-</div>
                    <div class="stat-label">总订单数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-paid-orders">-</div>
                    <div class="stat-label">已支付订单</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-total-amount">-</div>
                    <div class="stat-label">总营收(元)</div>
                </div>
            </div>

            <!-- Tab 导航 -->
            <div class="tabs">
                <div class="tab active" onclick="switchTab('products')">商品管理</div>
                <div class="tab" onclick="switchTab('cards')">卡密导入</div>
                <div class="tab" onclick="switchTab('orders')">订单列表</div>
            </div>

            <!-- 商品管理 -->
            <div id="tab-products" class="tab-content active">
                <div class="admin-card">
                    <h3>添加商品</h3>
                    <div class="form-group">
                        <label>商品名称</label>
                        <input type="text" id="new-product-name" placeholder="例如：XX会员月卡">
                    </div>
                    <div class="form-group">
                        <label>商品描述</label>
                        <textarea id="new-product-desc" placeholder="商品描述（可选）"></textarea>
                    </div>
                    <div class="form-group">
                        <label>价格（元）</label>
                        <input type="number" id="new-product-price" step="0.01" min="0.01" placeholder="例如：29.90">
                    </div>
                    <button class="btn btn-primary" onclick="addProduct()">添加商品</button>
                </div>

                <div class="admin-card">
                    <h3>商品列表</h3>
                    <div id="product-list-admin"></div>
                </div>
            </div>

            <!-- 卡密导入 -->
            <div id="tab-cards" class="tab-content">
                <div class="admin-card">
                    <h3>批量导入卡密</h3>
                    <div class="form-group">
                        <label>选择商品</label>
                        <select id="card-product-select"></select>
                    </div>
                    <div class="form-group">
                        <label>卡密类型（可选）</label>
                        <input type="text" id="card-type" placeholder="例如：卡号密码 / 激活码 / default" value="default">
                    </div>
                    <div class="form-group">
                        <label>卡密内容（每行一条）</label>
                        <textarea id="card-content" placeholder="XXXX-XXXX-XXXX-XXXX&#10;YYYY-YYYY-YYYY-YYYY&#10;ZZZZ-ZZZZ-ZZZZ-ZZZZ"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="importCards()">导入卡密</button>
                    <p class="hint">单次最多导入500条，导入后可在商品列表查看库存</p>
                </div>
            </div>

            <!-- 订单列表 -->
            <div id="tab-orders" class="tab-content">
                <div class="admin-card">
                    <h3>最近订单</h3>
                    <div style="overflow-x:auto;">
                        <table class="order-table">
                            <thead>
                                <tr>
                                    <th>订单号</th>
                                    <th>商品</th>
                                    <th>数量</th>
                                    <th>金额</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                </tr>
                            </thead>
                            <tbody id="order-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 自动发卡商城 · 管理后台</p>
        </div>
    </footer>

    <script>
        const API_BASE = window.location.hostname === 'localhost'
            ? 'http://localhost:3000/api'
            : '/api';

        let adminToken = localStorage.getItem('admin_token');

        // 初始化
        if (adminToken) {
            showAdminPage();
        }

        // 登录
        async function doLogin() {
            const password = document.getElementById('login-password').value;
            if (!password) { alert('请输入密码'); return; }

            try {
                const res = await fetch(`${API_BASE}/admin-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();

                if (data.success) {
                    adminToken = data.token;
                    localStorage.setItem('admin_token', adminToken);
                    showAdminPage();
                } else {
                    alert(data.message || '登录失败');
                }
            } catch (err) {
                alert('网络错误');
            }
        }

        // 退出
        function doLogout() {
            localStorage.removeItem('admin_token');
            adminToken = null;
            document.getElementById('login-page').style.display = 'block';
            document.getElementById('admin-page').style.display = 'none';
        }

        // 显示管理页
        function showAdminPage() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('admin-page').style.display = 'block';
            loadProducts();
            loadOrders();
        }

        // 切换Tab
        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');

            if (name === 'orders') loadOrders();
            if (name === 'products') loadProducts();
            if (name === 'cards') loadProductSelect();
        }

        // 鉴权请求
        async function authFetch(url, options = {}) {
            options.headers = {
                ...options.headers,
                'Authorization': `Bearer ${adminToken}`
            };
            const res = await fetch(url, options);
            if (res.status === 401) {
                doLogout();
                alert('登录已过期，请重新登录');
                throw new Error('Unauthorized');
            }
            return res.json();
        }

        // 加载商品
        async function loadProducts() {
            try {
                const data = await authFetch(`${API_BASE}/admin-products`);
                if (data.success) {
                    renderProducts(data.products);
                    renderProductSelect(data.products);
                }
            } catch (err) {
                console.error(err);
            }
        }

        // 渲染商品列表
        function renderProducts(products) {
            const container = document.getElementById('product-list-admin');
            if (products.length === 0) {
                container.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">暂无商品</p>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="product-row">
                    <div class="product-info">
                        <div class="name">${escapeHtml(p.name)}</div>
                        <div class="meta">${escapeHtml(p.description || '无描述')} · 库存：${p.stock} 件</div>
                    </div>
                    <div class="product-price">¥${p.price.toFixed(2)}</div>
                </div>
            `).join('');
        }

        // 渲染商品下拉选择
        function renderProductSelect(products) {
            const select = document.getElementById('card-product-select');
            select.innerHTML = products.map(p =>
                `<option value="${p.id}">${escapeHtml(p.name)} (库存:${p.stock})</option>`
            ).join('');
        }

        function loadProductSelect() {
            loadProducts();
        }

        // 添加商品
        async function addProduct() {
            const name = document.getElementById('new-product-name').value.trim();
            const description = document.getElementById('new-product-desc').value.trim();
            const price = document.getElementById('new-product-price').value;

            if (!name) { alert('请输入商品名称'); return; }
            if (!price || parseFloat(price) <= 0) { alert('请输入有效价格'); return; }

            try {
                const data = await authFetch(`${API_BASE}/admin-products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description, price: parseFloat(price) })
                });

                if (data.success) {
                    alert('商品添加成功');
                    document.getElementById('new-product-name').value = '';
                    document.getElementById('new-product-desc').value = '';
                    document.getElementById('new-product-price').value = '';
                    loadProducts();
                } else {
                    alert(data.message || '添加失败');
                }
            } catch (err) {
                console.error(err);
            }
        }

        // 导入卡密
        async function importCards() {
            const productId = document.getElementById('card-product-select').value;
            const cardType = document.getElementById('card-type').value.trim() || 'default';
            const rawText = document.getElementById('card-content').value.trim();

            if (!productId) { alert('请选择商品'); return; }
            if (!rawText) { alert('请输入卡密内容'); return; }

            try {
                const data = await authFetch(`${API_BASE}/admin-cards`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId, cardType, rawText })
                });

                if (data.success) {
                    alert(data.message || '导入成功');
                    document.getElementById('card-content').value = '';
                    loadProducts();
                } else {
                    alert(data.message || '导入失败');
                }
            } catch (err) {
                console.error(err);
            }
        }

        // 加载订单
        async function loadOrders() {
            try {
                const data = await authFetch(`${API_BASE}/admin-orders?limit=100`);
                if (data.success) {
                    renderOrders(data.orders);
                    renderStats(data.orders);
                }
            } catch (err) {
                console.error(err);
            }
        }

        // 渲染订单
        function renderOrders(orders) {
            const tbody = document.getElementById('order-table-body');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;padding:20px;">暂无订单</td></tr>';
                return;
            }
            tbody.innerHTML = orders.map(o => `
                <tr>
                    <td style="font-family:monospace;font-size:12px;">${o.order_no}</td>
                    <td>${escapeHtml(o.product_name)}</td>
                    <td>${o.quantity}</td>
                    <td style="color:#e74c3c;font-weight:600;">¥${o.amount.toFixed(2)}</td>
                    <td><span class="status-badge status-${o.status}">${statusText(o.status)}</span></td>
                    <td style="font-size:12px;color:#999;">${formatDate(o.created_at)}</td>
                </tr>
            `).join('');
        }

        // 统计
        function renderStats(orders) {
            const paid = orders.filter(o => o.status === 'paid');
            const totalAmount = paid.reduce((sum, o) => sum + o.amount, 0);
            document.getElementById('stat-total-orders').textContent = orders.length;
            document.getElementById('stat-paid-orders').textContent = paid.length;
            document.getElementById('stat-total-amount').textContent = totalAmount.toFixed(2);
        }

        function statusText(s) {
            return { pending: '待支付', paid: '已支付', failed: '已失败' }[s] || s;
        }

        function formatDate(d) {
            if (!d) return '-';
            return new Date(d).toLocaleString('zh-CN');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 回车登录
        document.getElementById('login-password').addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
